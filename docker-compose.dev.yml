services:
  marzban-dev:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.development
    environment:
      # Override DB path to write inside the volume so it survives rebuilds.
      SQLALCHEMY_DATABASE_URL: sqlite:////data/dev.sqlite3
      # Xray is installed inside the Docker image, so we can enable it here.
      XRAY_ENABLED: "True"
      XRAY_EXECUTABLE_PATH: /usr/local/bin/xray
      XRAY_ASSETS_PATH: /usr/local/share/xray
    ports:
      - "8000:8000"   # backend API + dashboard
      - "3000:3000"   # Vite dev server (only active when DEBUG=True)
    volumes:
      # Mount source code for hot-reload (uvicorn --reload picks up changes).
      - .:/code
      # Persistent data (DB, certs) stored outside the container.
      - marzban-dev-data:/data
    command: >
      bash -c "
        alembic upgrade head &&
        python scripts/seed.py &&
        python main.py
      "

volumes:
  marzban-dev-data:
